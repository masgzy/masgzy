# ══════════════════════════════════════════════════════
# Snake Animation 🐍 — 贪吃蛇贡献动画生成器
# 作用：每天自动把你的贡献格子生成贪吃蛇动画 SVG，推送到 output 分支
# ══════════════════════════════════════════════════════

name: Snake Animation 🐍

on:
  schedule:
    - cron: "0 0 * * *"    # 每天 UTC 0 点跑一次（北京时间早上 8 点）
  workflow_dispatch:        # 允许手动触发（首次部署要用！）
  push:
    branches: [main]        # 若仓库默认分支是 master，请改成 master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 第 1 步：生成亮色 + 暗色两份贪吃蛇 SVG
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 第 2 步：把 SVG 发布到 output 分支，README 里的 <picture> 从这里读取
      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
